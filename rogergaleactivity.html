<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: url(roger.jpg) center / cover no-repeat;
    font-family: Arial, sans-serif;
  }

  .login {
    margin: 12px;
    padding: 24px 24px 60px;
    background: rgba(255, 255, 255, 0.8);
    border-radius: 25px;
  }

  h2 { color: #4a4fd1; margin-top: 0; }
  label { display: block; font-size: 12px; }
  input { display: block; margin-bottom: 12px; }
</style>
</head>
<body>

  <div class="login">
    <h2>Login</h2>

    <label>Username</label>
    <input type="text">

    <label>Password</label>
    <input type="password">

    <button>Login</button>
  </div>

</body>
</html>
