<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create a Internet Mail Account</title>
  </style>
</head>
<body>

  <h1>Create a Internet Mail Account</h1>

  <form action="#" method="post">

    <p>First Name <input type="text" name="firstname" size="30"></p>

    <p>Last Name <input type="text" name="lastname" size="30"></p>

    <p>Desired Login Name <input type="text" name="login" size="20"> @mail.com</p>

    <p>Password <input type="password" name="password" size="20"></p>

    <p>
      <input type="radio" name="gender" value="male" checked> Male<br>
      <input type="radio" name="gender" value="female"> Female
    </p>

    <p>
      Birthday
      <input type="text" name="day" size="4">
      <select name="month">
        <option value="">-Select One-</option>
        <option value="1">January</option>
        <option value="2">February</option>
        <option value="3">March</option>
        <option value="4">April</option>
        <option value="5">May</option>
        <option value="6">June</option>
        <option value="7">July</option>
        <option value="8">August</option>
        <option value="9">September</option>
        <option value="10">October</option>
        <option value="11">November</option>
        <option value="12">December</option>
      </select>
      <input type="text" name="year" size="12">
    </p>

    <p>
      Type Yourself
      <textarea name="about" rows="6" cols="25"></textarea>
    </p>

    <input type="submit" value="Accept">
    <input type="reset" value="Cancel">

  </form>

</body>
</html>
